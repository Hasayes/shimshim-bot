name: ShimShim bot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, offset to dodge the congested :00/:15/:30/:45 slots
  workflow_dispatch:           # manual runs + the external 15-min pinger
    inputs:
      dry_run:
        description: "Fetch + prefilter only; no Claude, no sends, no persist"
        required: false
        default: false
        type: boolean

# Let the job commit the updated state.json back to the repo
permissions:
  contents: write

concurrency:
  group: shimshim-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Triggered every 15 min by an external pinger (cron-job.org →
      # workflow_dispatch); the GitHub cron above is a free backup, since
      # GitHub fires it unreliably (observed 1-3h gaps).
      - name: Poll and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_PROVIDER: ${{ vars.NEWS_PROVIDER || 'newsdata' }}
          NEWSDATA_PAGES: ${{ vars.NEWSDATA_PAGES || '1' }}
          # --- Cost / accuracy posture (single source of truth; tune via repo Variables) ---
          # Triage is always cheap Haiku. Web-verify (Sonnet + web search) is
          # the real spend, so it's targeted where accuracy matters most:
          # FULLY LEAN: no web-verify at all. Triage-only Haiku + free oracle
          # gate at poll time, then the free daily solidity check catches any
          # wrong card after the fact. Flip any of these to '1' via repo
          # Variables to re-enable a verify path for a busy window.
          #   VERIFY_NEWS=0     do NOT web-verify newsdata deals — max saving
          #   VERIFY_INTEREST=0 do NOT web-verify rumours (highest volume)
          #   SKIP_VERIFY_TELEGRAM=1  Telegram deals skip verify (moot while both off)
          #   WEB_SEARCH_MAX_USES=2   only applies if a verify path is re-enabled
          #   CROSS_CHECK=0     no extra Sonnet pass
          #   ORACLE_SANITY=1   free club-oracle gate — keep on
          CLASSIFY_MODEL: ${{ vars.CLASSIFY_MODEL || 'claude-haiku-4-5' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
          VERIFY_NEWS: ${{ vars.VERIFY_NEWS || '0' }}
          VERIFY_INTEREST: ${{ vars.VERIFY_INTEREST || '0' }}
          SKIP_VERIFY_TELEGRAM: ${{ vars.SKIP_VERIFY_TELEGRAM || '1' }}
          WEB_SEARCH_MAX_USES: ${{ vars.WEB_SEARCH_MAX_USES || '2' }}
          CROSS_CHECK: ${{ vars.CROSS_CHECK || '0' }}
          ORACLE_SANITY: ${{ vars.ORACLE_SANITY || '1' }}
          # --- Transfer-window gate: rumours only publish while a window is
          # open (deals are never gated). Window dates drift a few days each
          # season — retune the "MM-DD" boundaries via repo Variables when the
          # league confirms them. WINDOW_GATE=0 disables the gate entirely.
          WINDOW_GATE: ${{ vars.WINDOW_GATE || '1' }}
          SUMMER_WINDOW_OPEN: ${{ vars.SUMMER_WINDOW_OPEN || '06-10' }}
          SUMMER_WINDOW_CLOSE: ${{ vars.SUMMER_WINDOW_CLOSE || '09-01' }}
          WINTER_WINDOW_OPEN: ${{ vars.WINTER_WINDOW_OPEN || '01-01' }}
          WINTER_WINDOW_CLOSE: ${{ vars.WINTER_WINDOW_CLOSE || '02-03' }}
          VAPID_PRIVATE_KEY_PEM: ${{ secrets.VAPID_PRIVATE_KEY_PEM }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          PUSH_ENC_KEY: ${{ secrets.PUSH_ENC_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          if [[ -n "$VAPID_PRIVATE_KEY_PEM" ]]; then
            echo "$VAPID_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/vapid.pem"
            export VAPID_PEM_FILE="$RUNNER_TEMP/vapid.pem"
          fi
          git config user.name "shimshim-bot"
          git config user.email "bot@users.noreply.github.com"
          persist() {
            if [[ -n "$(git status --porcelain state.json docs/feed.json docs/push-meta.json docs/crests.json docs/archive push-subs.enc)" ]]; then
              git add state.json docs/feed.json docs/push-meta.json docs/crests.json docs/archive push-subs.enc
              git commit -m "update state [skip ci]"
              # main may have moved while the poll ran — rebase and retry,
              # else sent cards are lost and the next run re-sends them
              n=0
              until git push; do
                n=$((n+1)); [ "$n" -gt 3 ] && return 1
                git pull --rebase -X theirs origin main
              done
            else
              echo "no state change"
            fi
          }
          python shimshim_bot.py
          persist
