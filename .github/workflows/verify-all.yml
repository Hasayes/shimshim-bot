name: verify-all (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: shimshim-bot
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify every card
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python verify_all.py
      - name: Persist
        run: |
          if [[ -n "$(git status --porcelain docs/feed.json state.json)" ]]; then
            git config user.name "shimshim-bot"
            git config user.email "bot@users.noreply.github.com"
            git add docs/feed.json state.json
            git commit -m "full-feed solidity audit [skip ci]"
            n=0
            until git push; do
              n=$((n+1)); [ "$n" -gt 3 ] && exit 1
              git pull --rebase origin main
            done
          fi
