name: ShimShim bot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, offset to dodge the congested :00/:15/:30/:45 slots
  workflow_dispatch:           # manual runs + the external 15-min pinger
    inputs:
      dry_run:
        description: "Fetch + prefilter only; no Claude, no sends, no persist"
        required: false
        default: false
        type: boolean

# Let the job commit the updated state.json back to the repo
permissions:
  contents: write

concurrency:
  group: shimshim-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Triggered every 15 min by an external pinger (cron-job.org →
      # workflow_dispatch); the GitHub cron above is a free backup, since
      # GitHub fires it unreliably (observed 1-3h gaps).
      - name: Poll and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_PROVIDER: ${{ vars.NEWS_PROVIDER || 'newsdata' }}
          NEWSDATA_PAGES: ${{ vars.NEWSDATA_PAGES || '1' }}
          VAPID_PRIVATE_KEY_PEM: ${{ secrets.VAPID_PRIVATE_KEY_PEM }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          PUSH_ENC_KEY: ${{ secrets.PUSH_ENC_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          # --- Cost posture (pinned lean; override via repo Variables) ---
          # Steady state uses ONLY cheap Haiku triage: no Sonnet, no web
          # search, no cross-check. Flip a repo Variable to re-enable a path
          # for a busy window; code defaults already match these values, but
          # pinning them here prevents a default drift from silently spending.
          CLASSIFY_MODEL: ${{ vars.CLASSIFY_MODEL || 'claude-haiku-4-5' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
          VERIFY_NEWS: ${{ vars.VERIFY_NEWS || '0' }}
          VERIFY_INTEREST: ${{ vars.VERIFY_INTEREST || '0' }}
          SKIP_VERIFY_TELEGRAM: ${{ vars.SKIP_VERIFY_TELEGRAM || '1' }}
          CROSS_CHECK: ${{ vars.CROSS_CHECK || '0' }}
          WEB_SEARCH_MAX_USES: ${{ vars.WEB_SEARCH_MAX_USES || '1' }}
        run: |
          if [[ -n "$VAPID_PRIVATE_KEY_PEM" ]]; then
            echo "$VAPID_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/vapid.pem"
            export VAPID_PEM_FILE="$RUNNER_TEMP/vapid.pem"
          fi
          git config user.name "shimshim-bot"
          git config user.email "bot@users.noreply.github.com"
          persist() {
            if [[ -n "$(git status --porcelain state.json docs/feed.json docs/push-meta.json docs/crests.json docs/archive push-subs.enc)" ]]; then
              git add state.json docs/feed.json docs/push-meta.json docs/crests.json docs/archive push-subs.enc
              git commit -m "update state [skip ci]"
              # main may have moved while the poll ran — rebase and retry,
              # else sent cards are lost and the next run re-sends them
              n=0
              until git push; do
                n=$((n+1)); [ "$n" -gt 3 ] && return 1
                git pull --rebase -X theirs origin main
              done
            else
              echo "no state change"
            fi
          }
          python shimshim_bot.py
          persist
