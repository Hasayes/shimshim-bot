name: reconcile (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: shimshim-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Reconcile open cards against reality
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python reconcile_feed.py
      - name: Persist
        run: |
          if [[ -n "$(git status --porcelain docs/feed.json state.json)" ]]; then
            git config user.name "shimshim-bot"
            git config user.email "bot@users.noreply.github.com"
            git add docs/feed.json state.json
            git commit -m "reconcile open cards [skip ci]"
            n=0
            until git push origin HEAD; do
              n=$((n+1)); [ "$n" -gt 3 ] && exit 1
              git pull --rebase -X theirs origin ${{ github.ref_name }}
            done
          else
            echo "no changes"
          fi
