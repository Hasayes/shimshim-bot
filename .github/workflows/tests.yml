name: tests

# Offline regression suite. The bot ships with no test gate, so these
# pinned-mistake checks (test_rumour_gates, test_search_upgrade) ran only
# when someone remembered to. This runs them on every push that touches the
# code they guard, so a regression can't merge silently.
on:
  push:
    paths:
      - "shimshim_bot.py"
      - "verify_all.py"
      - "test_*.py"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run offline tests
        env:
          # dummy creds so module import never blocks; the tests hit no network
          NEWS_API_KEY: x
          TELEGRAM_BOT_TOKEN: x
          TELEGRAM_CHAT_ID: x
          ANTHROPIC_API_KEY: x
        run: |
          python test_rumour_gates.py
          python test_verify_sweep.py
          python test_search_upgrade.py
